[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydeepgraph"
version = "0.1.0"
description = "WebGPU billion-point and graph visualization widget for Jupyter, Marimo, and DuckDB (.arrowtiles)"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Kai Erlenbusch", email = "erlenbusch@uchicago.edu" },
]
keywords = [
    "webgpu",
    "anywidget",
    "marimo",
    "jupyter",
    "arrowtiles",
    "duckdb",
    "scatterplot",
    "graph-visualization",
    "umap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anywidget>=0.9.13",
    "arrowtiles>=0.1.1",
    "duckdb>=1.0.0",
    "narwhals>=1.10.0",
    "numpy>=1.24.0",
    "pyarrow>=16.0.0",
    "traitlets>=5.10.0",
]

[project.optional-dependencies]
marimo = ["marimo>=0.11.0"]
dev = [
    "build>=1.2.0",
    "marimo>=0.11.0",
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/kai-erlenbusch/deepgraph"
Repository = "https://github.com/kai-erlenbusch/deepgraph"
Issues = "https://github.com/kai-erlenbusch/deepgraph/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pydeepgraph*"]

[tool.setuptools.package-data]
pydeepgraph = ["_static/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
