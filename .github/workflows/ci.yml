name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck source
        run: npm run typecheck

      - name: Build bundler & standalone library bundles + declarations
        run: npm run build:lib

      - name: Verify external consumer TypeScript (bundler + nodenext) & Vite app build
        run: npm run verify:types

      - name: Build standalone demo application
        run: npm run build:demo
