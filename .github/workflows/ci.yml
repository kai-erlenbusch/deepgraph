name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (deterministic lockfile)
        run: npm ci

      - name: Typecheck source & unit tests
        run: npm run typecheck

      - name: Build bundler, standalone, mosaic & anywidget bundles + declarations
        run: npm run build:lib && npm run build:widget

      - name: Verify external consumer TypeScript (bundler + nodenext) & Vite app build
        run: npm run verify:types

      - name: Run unit tests
        run: npm run test:unit

      - name: Build standalone demo application
        run: npm run build:demo

      - name: Setup Python 3.12 for pydeepgraph verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pydeepgraph wheel/sdist & run pytest + marimo check
        run: |
          python -m pip install --upgrade pip build pytest polars pandas marimo "setuptools>=77.0"
          python -m build ./python
          python -m pip install python/dist/pydeepgraph-*.whl
          python -m pytest python/tests -v -W error::UserWarning -W "error::DeprecationWarning:pydeepgraph.*"
          python -m marimo check python/examples/marimo_lmsys_mosaic.py python/examples/marimo_gaia_1_35b.py
