name: Release

on:
  push:
    tags:
      - "v*"
      - "pydeepgraph-v*"

permissions:
  contents: read

jobs:
  build-npm:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Verify Git tag matches package.json version
        run: |
          EXPECTED_TAG="v$(node -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('./package.json', 'utf8')).version)")"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag mismatch: GITHUB_REF_NAME=${GITHUB_REF_NAME} vs expected ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - name: Install dependencies (deterministic lockfile)
        run: npm ci

      - name: Typecheck source & unit tests
        run: npm run typecheck

      - name: Build bundler, standalone & mosaic bundles + declarations
        run: npm run build:lib

      - name: Verify external consumer TypeScript & Vite app build
        run: npm run verify:types

      - name: Run unit tests
        run: npm run test:unit

      - name: Pack exact verified npm tarball
        run: npm pack --ignore-scripts

      - name: Upload verified npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: deepgraph-*.tgz
          if-no-files-found: error

  publish-npm:
    if: startsWith(github.ref_name, 'v')
    needs: [build-npm]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          NPM_VER="$(npm --version)"
          echo "Detected npm ${NPM_VER}"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map((n) => parseInt(n, 10));
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            process.exit(ok ? 0 : 1);
          ' "${NPM_VER}" || npm install -g "npm@^11.5.1"
          npm --version

      - name: Download verified npm tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-tarball

      - name: Publish verified tarball to npm via OIDC Trusted Publishing
        run: npm publish ./deepgraph-*.tgz --provenance --access public --loglevel verbose

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" ./deepgraph-*.tgz --generate-notes

  build-pypi:
    if: startsWith(github.ref_name, 'pydeepgraph-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install JS dependencies & build self-contained widget.js
        run: npm ci && npm run typecheck && npm run build:lib && npm run build:widget

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Git tag matches python/pyproject.toml and pydeepgraph.__version__
        run: |
          EXPECTED_VER="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('python/pyproject.toml').read_text())['project']['version'])")"
          EXPECTED_TAG="pydeepgraph-v${EXPECTED_VER}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag mismatch: GITHUB_REF_NAME=${GITHUB_REF_NAME} vs expected ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - name: Build pydeepgraph wheel & sdist and run pytest + marimo check
        run: |
          python -m pip install --upgrade pip build pytest polars pandas marimo "setuptools>=77.0"
          python -m build ./python
          python -m pip install python/dist/pydeepgraph-*.whl
          python -c "import tomllib, pathlib, pydeepgraph; exp = tomllib.loads(pathlib.Path('python/pyproject.toml').read_text())['project']['version']; assert pydeepgraph.__version__ == exp, f'{pydeepgraph.__version__} != {exp}'"
          python -m pytest python/tests -v -W error::UserWarning -W "error::DeprecationWarning:pydeepgraph.*"
          python -m marimo check python/examples/marimo_lmsys_mosaic.py python/examples/marimo_gaia_1_35b.py

      - name: Upload verified Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dists
          path: python/dist/*
          if-no-files-found: error

  publish-pypi:
    if: startsWith(github.ref_name, 'pydeepgraph-v')
    needs: [build-pypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download verified Python distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dists
          path: dist

      - name: Publish pydeepgraph to PyPI via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" dist/* --generate-notes
